version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/warehouse/hr_analytics.duckdb
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      # No `:-` default: a missing secret must fail loudly rather than
      # silently starting with an empty one.
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DB_PATH=/app/data/auth/auth.db
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      # Cloud Storage / S3 settings (respecting storage layers; loaded from host if set)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_USE_SSL=${AWS_S3_USE_SSL:-true}
      - DATA_PREFIX=
    volumes:
      - ./warehouse:/app/warehouse
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./dbt_analytics:/app/dbt_analytics
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: hr-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
