name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Lint & Type Check (Gate 1)
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Frontend Checks ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Type Check (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      # --- Backend Checks ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Run Backend Lint (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Stylistic linting checks run as non-blocking warnings
          flake8 backend/app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Job 2: Test Suite (Gate 2)
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Setup Node & Frontend Tests ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests (Vitest)
        working-directory: frontend
        run: npx vitest run src/

      # --- Setup Python & Backend Tests ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r backend/requirements.txt

      - name: Run Data Ingestion & Build Analytical views
        run: |
          python scripts/refresh_all.py

      - name: Run Backend Tests (Pytest)
        run: |
          pytest

  # Job 3: Docker Build Verification (Gate 3)
  docker-build:
    name: Docker Cache Build
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image with layer caching
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend Image with layer caching
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: hr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
