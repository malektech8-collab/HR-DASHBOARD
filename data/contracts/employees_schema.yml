# Canonical bilingual schema - employees
#
# Single source of truth for: the downloadable template, the validation rules,
# the UI labels, and the error messages. See docs/PRODUCT-ARCHITECTURE.md section 4.
#
# BACKWARD COMPATIBILITY: scripts/validate_schema.py reads only `columns` and,
# per column, `name` / `required` / `type` / `allowed_values`. Every other key
# here is additive and ignored by the validator.
#
# allowed_values MUST stay a flat list of strings - the validator compares raw
# cell values against set(allowed_values). Bilingual display lives in the
# parallel `value_labels` map.
#
# NOT YET ENFORCED (scheduled for cycle 1b, before Phase 2 real data):
#   `unique`, `min_value` - declared below but inert in the current validator.
# `observed_values` is sample-derived documentation only. It is NOT a
# vocabulary, is never validated against, and is not exhaustive.

version: 1
table: employees
label_en: Employees
label_ar: الموظفون
description_en: One row per employee. The workforce master record.
description_ar: صف واحد لكل موظف. السجل الرئيسي للقوى العاملة.
columns:
- name: employee_id
  name_en: Employee ID
  name_ar: الرقم الوظيفي
  type: VARCHAR
  required: true
  unique: true
  # Primary key. A duplicate here is structural, not a row-level
  # exception: it corrupts every join and inflates every aggregate.
  primary_key: true
  description_en: Unique identifier of the employee within the company.
  description_ar: المعرّف الفريد للموظف داخل الشركة.
  example: EMP001
- name: employee_name
  name_en: Employee Name
  name_ar: اسم الموظف
  type: VARCHAR
  required: true
  description_en: Full name as it appears on official documents.
  description_ar: الاسم الكامل كما يظهر في الوثائق الرسمية.
  example: Ahmed Al-Otaibi
- name: nationality
  name_en: Nationality
  name_ar: الجنسية
  type: VARCHAR
  required: true
  description_en: Nationality as stated on the national ID or Iqama.
  description_ar: الجنسية كما وردت في الهوية الوطنية أو الإقامة.
  example: Saudi
  # The second user of `flag_values`, and the first outside a closed
  # vocabulary. `غير سعودي` means literally "non-Saudi": a CATEGORY recorded
  # where a nationality belongs. It is not wrong — is_saudi resolves to false
  # and every Saudization figure is correct — but Nitaqat reporting is not
  # only the Saudi/non-Saudi binary, and for these employees the nationality
  # needed for anything finer does not exist in the source.
  #
  # EXCEPTION, not REJECT: the file is well-formed and the value is legal.
  # Refusing it would demand the client invent a nationality.
  #
  # Exact-match, like every `flag_values` rule: another client writing
  # "غير سعودية" or "Non-Saudi" is not caught until that spelling is declared
  # here. Stated rather than generalised — a fuzzy match on a free-text column
  # would flag real nationalities.
  flag_values:
    غير سعودي:
      severity: exception
      reason_en: The source recorded a category ("non-Saudi") rather than a nationality.
        Saudization is unaffected, but no nationality is available for any reporting
        finer than the Saudi/non-Saudi split.
      reason_ar: سجّل المصدر فئة ("غير سعودي") بدلاً من الجنسية. لا يتأثر احتساب السعودة،
        لكن لا تتوفر جنسية لأي تقرير أدق من تقسيم سعودي/غير سعودي.
- name: is_saudi
  name_en: Saudi National
  name_ar: سعودي
  type: BOOLEAN
  required: false
  # Derived when absent. Real HRIS exports carry `nationality`, not this
  # boolean. The rule is resolved from the registry in scripts/derivations.py
  # by NAME — contracts never carry executable expressions — and raises on any
  # nationality value it does not recognise rather than defaulting to false,
  # because this field drives Saudization and Nitaqat banding.
  #
  # ACTIVE as of cycle 1b-i: ingest derives this ONLY when the column is absent
  # from the file. A file that supplies it is taken at its word.
  derived_from: nationality
  derivation: nationality_is_saudi
  description_en: Whether the employee counts as Saudi for Saudization. Derived from nationality when the column is absent.
  description_ar: ما إذا كان الموظف يحتسب سعودياً لأغراض السعودة. يشتق من الجنسية عند غياب العمود.
  example: 'true'
- name: company
  name_en: Company
  name_ar: الشركة
  type: VARCHAR
  required: false
  description_en: 'Legal entity employing the person. OPTIONAL since 2026-08: requiring it
    assumed a MULTI-ENTITY client. A single-legal-entity client has no such column because
    the whole file is one company, and that is the common case. Absent means one entity or
    none recorded - it does not mean the employees have no employer.'
  description_ar: 'الكيان القانوني الموظف. اختياري منذ ٢٠٢٦-٠٨: اشتراطه كان يفترض عميلاً متعدد
    الكيانات، بينما العميل ذو الكيان الواحد لا يملك هذا العمود أصلاً لأن الملف كله لكيان واحد.'
  example: Company A
- name: department
  name_en: Department
  name_ar: القسم
  type: VARCHAR
  required: true
  description_en: Organisational department.
  description_ar: الإدارة التنظيمية.
  example: Finance
- name: location
  name_en: Location
  name_ar: الموقع
  type: VARCHAR
  required: true
  description_en: 'The site, office or yard this row belongs to. Must match a `location` in
    your locations file - that file is what says which project each site belongs to. Renamed
    from `project` in 2026-08: this column always held the physical site (the employees contract
    said so in its own work_unit description), while nothing recorded the project above it.
    A project is no longer an attribute of a row.'
  description_ar: 'الموقع أو المكتب الذي ينتمي إليه هذا الصف. يجب أن يطابق موقعاً في ملف المواقع،
    وهو الملف الذي يحدد المشروع التابع له كل موقع. أُعيدت تسميته من `project` في ٢٠٢٦-٠٨:
    كان هذا العمود يحمل دائماً الموقع الفعلي، ولم يكن هناك ما يسجّل المشروع الأعلى منه.'
  example: RUH-TOWER-P1
- name: job_title
  name_en: Job Title
  name_ar: المسمى الوظيفي
  type: VARCHAR
  required: true
  description_en: Job title as stated in the employment contract.
  description_ar: المسمى الوظيفي كما ورد في عقد العمل.
  example: Accountant
- name: job_family
  name_en: Job Family
  name_ar: المجموعة الوظيفية
  type: VARCHAR
  required: false
  description_en: 'Broader job grouping used for analytics. OPTIONAL since 2026-08: this is
    a DERIVED TAXONOMY, not a source field, and many HRIS deployments do not maintain one.
    Recorded for completeness - measured 2026-08, it has NO consumer anywhere in this system:
    no mart, no KPI, no endpoint, no frontend.'
  description_ar: 'التصنيف الوظيفي الأوسع المستخدم في التحليلات. اختياري منذ ٢٠٢٦-٠٨: وهو
    تصنيف مشتق وليس حقلاً مصدرياً، ولا تحتفظ به كثير من أنظمة الموارد البشرية.'
  example: Finance
- name: grade
  name_en: Grade
  name_ar: الدرجة الوظيفية
  type: VARCHAR
  required: true
  description_en: Internal salary or job grade.
  description_ar: الدرجة الوظيفية الداخلية.
  example: G7
- name: manager_id
  name_en: Manager ID
  name_ar: الرقم الوظيفي للمدير
  type: VARCHAR
  required: false
  description_en: Employee ID of the direct manager.
  description_ar: الرقم الوظيفي للمدير المباشر.
  example: EMP002
- name: cost_center
  name_en: Cost Center
  name_ar: مركز التكلفة
  type: VARCHAR
  required: false
  description_en: 'Accounting cost center the cost is charged to. OPTIONAL since 2026-08:
    this typically lives in the FINANCE system, not the HR export. Absent is a coverage fact,
    not a data-quality problem - the cost-centre exception checks are scoped to clients who
    provide the column, so an absent column produces one coverage note rather than one exception
    per employee.'
  description_ar: 'مركز التكلفة المحاسبي الذي تحمّل عليه التكلفة. اختياري منذ ٢٠٢٦-٠٨: وهو
    عادةً موجود في النظام المالي لا في تصدير الموارد البشرية. غيابه واقعة تغطية وليس مشكلة
    جودة بيانات.'
  example: CC-100
- name: employment_type
  name_en: Employment Type
  name_ar: نوع التوظيف
  type: VARCHAR
  required: true
  description_en: Full-time, part-time, or contract.
  description_ar: دوام كامل أو جزئي أو تعاقد.
  example: Full-time
  # Vocabulary authored by the practitioner, not derived from samples.
  # EXCEPTION severity: an unexpected value surfaces as a data quality
  # exception rather than refusing the client's whole file. Tighten to
  # REJECT once real files confirm the list.
  on_violation: exception
  allowed_values:
  - Full-time
  - Part-time
  - Contract
  - Temporary
  - Intern
  value_labels:
    Full-time:
      en: Full-time
      ar: دوام كامل
    Part-time:
      en: Part-time
      ar: دوام جزئي
    Contract:
      en: Contract
      ar: تعاقد
    Temporary:
      en: Temporary
      ar: مؤقت
    Intern:
      en: Intern
      ar: متدرب
- name: contract_type
  name_en: Contract Type
  name_ar: نوع العقد
  type: VARCHAR
  required: true
  description_en: Limited or unlimited term contract.
  description_ar: عقد محدد المدة أو غير محدد المدة.
  example: Unlimited
  # Vocabulary authored by the practitioner, not derived from samples.
  # EXCEPTION severity: an unexpected value surfaces as a data quality
  # exception rather than refusing the client's whole file. Tighten to
  # REJECT once real files confirm the list.
  on_violation: exception
  allowed_values:
  - Limited
  - Unlimited
  value_labels:
    Limited:
      en: Limited
      ar: محدد المدة
    Unlimited:
      en: Unlimited
      ar: غير محدد المدة
- name: joining_date
  name_en: Joining Date
  name_ar: تاريخ الانضمام
  type: DATE
  required: true
  description_en: Date the employee started employment.
  description_ar: تاريخ بدء الموظف للعمل.
  example: '2024-03-15'
- name: termination_date
  name_en: Termination Date
  name_ar: تاريخ انتهاء الخدمة
  type: DATE
  required: false
  description_en: Date employment ended. Leave empty for active employees.
  description_ar: تاريخ انتهاء الخدمة. يترك فارغاً للموظفين على رأس العمل.
  example: '2026-01-31'
- name: contract_end_date
  name_en: Contract End Date
  name_ar: تاريخ انتهاء العقد
  type: DATE
  required: false
  description_en: Contract expiry date. Leave empty for unlimited contracts.
  description_ar: تاريخ انتهاء العقد. يترك فارغاً للعقود غير محددة المدة.
  example: '2027-03-14'
  # The global date ceiling is today + 2 years, which is right for a joining
  # date and wrong here. A multi-year fixed-term contract is ordinary in KSA,
  # particularly for senior staff, so the global rule REJECTED real files and
  # told the client to go find a corrupted Excel serial that was not there.
  #
  # Ten years is deliberately generous. The rule exists to catch CORRUPTION -
  # a year like 0025, a stray serial - not to audit whether a contract term is
  # sensible. That judgement is the client's and the Labour Law's, not a
  # validator's. A ceiling tight enough to be interesting would be a ceiling
  # that blocks honest files.
  max_years_ahead: 10
- name: status
  name_en: Employment Status
  name_ar: حالة الموظف
  type: VARCHAR
  required: true
  description_en: Current employment status.
  description_ar: الحالة الوظيفية الحالية.
  example: Active
  allowed_values:
  - Active
  - Inactive
  - Terminated
  - On Leave
  value_labels:
    Active:
      en: Active
      ar: نشط
    Inactive:
      en: Inactive
      ar: غير نشط
    Terminated:
      en: Terminated
      ar: منتهي الخدمة
    On Leave:
      en: On Leave
      ar: في إجازة
- name: basic_salary
  name_en: Basic Salary
  name_ar: الراتب الأساسي
  type: DECIMAL
  required: true
  description_en: Monthly basic salary in SAR, excluding allowances.
  description_ar: الراتب الأساسي الشهري بالريال السعودي، دون البدلات.
  example: '8000'
- name: housing_allowance
  name_en: Housing Allowance
  name_ar: بدل السكن
  type: DECIMAL
  required: true
  description_en: Monthly housing allowance in SAR.
  description_ar: بدل السكن الشهري بالريال السعودي.
  example: '2000'
- name: transport_allowance
  name_en: Transport Allowance
  name_ar: بدل النقل
  type: DECIMAL
  required: true
  description_en: Monthly transport allowance in SAR.
  description_ar: بدل النقل الشهري بالريال السعودي.
  example: '500'
- name: iqama_expiry
  name_en: Iqama Expiry
  name_ar: تاريخ انتهاء الإقامة
  type: DATE
  required: false
  # MOVED HERE FROM THE COMPLIANCE CONTRACT.
  #
  # THE PERIOD TEST decides where a column belongs: does the value change with
  # the REPORTING PERIOD? An iqama expiry does not - it changes when the iqama
  # is reissued. It is an attribute of the employee, not a fact about a month,
  # and it was in a period-grained contract only because that is where the
  # other compliance columns happened to live.
  #
  # It is also demonstrably where it already is: a real KSA HRIS export carries
  # the iqama expiry on the employee master. Asking for it in a separate
  # compliance file asked the client to re-supply what they had already sent.
  description_en: >-
    Iqama expiry date. Empty for Saudi nationals. OPTIONAL: a client whose HR
    system does not record it will have expiry figures withheld rather than
    reported as none expiring.
  description_ar: >-
    تاريخ انتهاء الإقامة. يترك فارغاً للسعوديين. اختياري: إذا لم يسجّله نظام
    الموارد البشرية، تُحجب أرقام الانتهاء بدلاً من عرضها كعدم وجود انتهاءات.
  example: '2026-12-31'
- name: iqama_occupation
  name_en: Occupation on Iqama
  name_ar: المهنة في الإقامة
  type: VARCHAR
  required: false
  # The occupation as printed on the iqama, which is frequently NOT the job the
  # employee actually does - and that divergence is a Qiwa audit finding.
  #
  # Same period test, same answer: it changes when the iqama is reissued, not
  # when the month turns. So it is an employee attribute whichever system
  # exports it, which makes the job-title comparison a SAME-FILE derivation for
  # every client rather than a cross-domain one.
  #
  # The occupation registered with GOSI stays a separate fact in the GOSI
  # contract. The two genuinely can differ, and where they do that divergence
  # is itself worth surfacing - arguably more valuable than either alone.
  description_en: >-
    The occupation recorded on the employee's iqama, for comparison against
    their actual job title. OPTIONAL.
  description_ar: >-
    المهنة المسجّلة في إقامة الموظف، لمقارنتها بمسماه الوظيفي الفعلي. اختياري.
  example: Accountant
- name: work_unit
  name_en: Work Unit
  name_ar: وحدة عمل
  type: VARCHAR
  required: false
  description_en: 'Work unit within a department, e.g. Payables under Finance. Optional -
    leave empty where a department is not subdivided. Recorded for completeness; nothing is
    currently grouped by it. CORRECTION (2026-08, org-dimensions cycle): this description
    previously read "Work unit within a department. The organisational hierarchy is Location
    -> Department -> Work Unit: the location (the `project` column) is the physical site and
    contains multiple departments, and each department contains one or more work units." That
    nesting is WRONG. Department is ORTHOGONAL to location and project - the demo data alone
    shows Engineering, HR and Operations each spanning two projects, and cross-cutting functions
    (Safety, Fleet, QA) span every site by design. Read as nested, Engineering at one site
    and Engineering at another would be different departments.'
  description_ar: 'وحدة العمل داخل القسم، مثل الحسابات الدائنة ضمن المالية. اختياري - يترك
    فارغاً إذا لم يكن القسم مقسماً إلى وحدات. يُسجَّل للاكتمال ولا يتم التجميع به حالياً.
    تصحيح (٢٠٢٦-٠٨): كان هذا الوصف يذكر أن التسلسل التنظيمي هو الموقع ثم القسم ثم وحدة العمل
    وأن الموقع يضم عدة أقسام. هذا غير صحيح: القسم مستقل عن الموقع والمشروع، والأقسام المشتركة
    مثل السلامة والجودة تمتد عبر جميع المواقع بحكم تصميمها.'
  example: Payables
- name: end_of_service_type
  name_en: End of Service Type
  name_ar: نوع نهاية الخدمة
  type: VARCHAR
  required: false
  description_en: 'Reason employment ended. Required when status is Terminated; leave empty
    for active employees. `Unspecified` means the SOURCE DID NOT RECORD the legal grounds.
    It is not a category of termination and must not be treated as one - no award, notice
    period or entitlement can be derived from it. FOR A FUTURE MART AUTHOR: `Unspecified`
    is an ABSENCE, not an eighth category. Grouping it beside Article 80 in a breakdown is
    the same defect as COALESCE(project, ''Unassigned'') - it renders a gap as a slice. Report
    the seven real reasons as categories and `Unspecified` as a coverage note: "N of M leavers
    have no recorded grounds".'
  required_when:
    column: status
    equals: Terminated
  description_ar: 'سبب انتهاء الخدمة. يعبأ فقط للموظفين المنتهية خدمتهم، ويترك فارغاً للموظفين
    على رأس العمل. القيمة `Unspecified` تعني أن النظام المصدر لم يسجّل السبب النظامي، وهي
    ليست نوعاً من أنواع إنهاء الخدمة ولا يجوز التعامل معها كذلك: لا يمكن اشتقاق أي مكافأة
    أو إشعار أو استحقاق منها.'
  example: Resignation
  allowed_values:
  - Resignation
  - Article 74
  - Article 75
  - Article 77
  - Article 80
  - Article 81
  - Probation
  - Unspecified
  value_labels:
    Resignation:
      en: Resignation
      ar: استقالة
    Article 74:
      en: Article 74
      ar: انتهاء العقد — المادة ٧٤
    Article 75:
      en: Article 75
      ar: إنهاء بإشعار — المادة ٧٥
    Article 77:
      en: Article 77
      ar: إنهاء دون سبب مشروع — المادة ٧٧
    Article 80:
      en: Article 80
      ar: فصل دون مكافأة أو إشعار — المادة ٨٠
    Article 81:
      en: Article 81
      ar: ترك العمل مع الاحتفاظ بالحقوق — المادة ٨١
    Probation:
      en: Probation - Article 53
      ar: إنهاء خلال فترة التجربة — المادة ٥٣
    Unspecified:
      en: Unspecified - grounds not recorded
      ar: غير محدد — لم يُسجَّل السبب النظامي
  flag_values:
    Unspecified:
      severity: exception
      reason_en: The legal grounds for this termination were not recorded in your source system.
        No end-of-service entitlement can be derived from it.
      reason_ar: لم يُسجَّل السبب النظامي لإنهاء هذه الخدمة في نظامك المصدر، ولا يمكن اشتقاق
        أي مستحقات نهاية خدمة منه.