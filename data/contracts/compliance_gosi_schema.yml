# Canonical bilingual schema - compliance_gosi
#
# ONE CONTRACT PER PLATFORM.
#
# `compliance` was a single contract whose columns came from at least three
# government platforms plus payroll - five portals with five logins. No client
# has one file containing all of them, and a client using Qiwa but not Mudad
# could not produce a row satisfying both.
#
# Splitting by platform means a client declares what they actually have, and a
# missing platform suppresses only its own figures. Before this, a missing
# compliance file darkened all eleven compliance metrics - including iqama
# expiry, which needs no platform export whatsoever.
#
# employee_id and period are required in each. Everything else is optional, so
# an export listing only one status still loads.
#
# Single source of truth for: the downloadable template, the validation rules,
# the UI labels, and the error messages. See docs/PRODUCT-ARCHITECTURE.md section 4.
#
# BACKWARD COMPATIBILITY: scripts/validate_schema.py reads only `columns` and,
# per column, `name` / `required` / `type` / `allowed_values`. Every other key
# here is additive and ignored by the validator.
#
# allowed_values MUST stay a flat list of strings - the validator compares raw
# cell values against set(allowed_values). Bilingual display lives in the
# parallel `value_labels` map.
#
# NOT YET ENFORCED (scheduled for cycle 1b, before Phase 2 real data):
#   `unique`, `min_value` - declared below but inert in the current validator.
# `observed_values` is sample-derived documentation only. It is NOT a
# vocabulary, is never validated against, and is not exhaustive.

version: 1
table: compliance_gosi
label_en: "GOSI"
label_ar: "التأمينات الاجتماعية"
description_en: "The GOSI contributor export - who is registered, at what wage, and under which occupation. The most complete of the four and the most likely to arrive intact."
description_ar: "سجلات منصة التأمينات الاجتماعية لكل موظف في كل فترة."
columns:
- name: employee_id
  name_en: Employee ID
  name_ar: الرقم الوظيفي
  type: VARCHAR
  required: true
  description_en: Unique identifier of the employee within the company.
  description_ar: المعرّف الفريد للموظف داخل الشركة.
  example: EMP001
- name: period
  name_en: Period
  name_ar: الفترة
  type: VARCHAR
  required: true
  description_en: Reporting month in YYYY-MM format.
  description_ar: شهر التقرير بصيغة سنة-شهر.
  example: 2026-06
- name: gosi_status
  name_en: GOSI Status
  name_ar: حالة التأمينات الاجتماعية
  type: VARCHAR
  required: false
  description_en: Registration status with GOSI.
  description_ar: حالة التسجيل في المؤسسة العامة للتأمينات الاجتماعية.
  example: Registered
  # Vocabulary authored by the practitioner, not derived from samples.
  # EXCEPTION severity: an unexpected value surfaces as a data quality
  # exception rather than refusing the client's whole file. Tighten to
  # REJECT once real files confirm the list.
  on_violation: exception
  allowed_values:
  - Registered
  - Not Registered
  - Suspended
  value_labels:
    Registered:
      en: Registered
      ar: مسجل
    Not Registered:
      en: Not Registered
      ar: غير مسجل
    Suspended:
      en: Suspended
      ar: موقوف
- name: gosi_salary
  name_en: GOSI Registered Salary
  name_ar: الراتب المسجل في التأمينات
  type: DECIMAL
  required: false
  description_en: Salary registered with GOSI, in SAR.
  description_ar: الراتب المسجل لدى التأمينات الاجتماعية بالريال السعودي.
  example: '10000'
# payroll_basic_salary REMOVED in the compliance-split cycle.
# It existed so gosi_salary could be compared against what payroll actually
# paid - a real finding - but it asked the CLIENT to copy payroll figures into
# a compliance export so that we could compare two numbers we already hold, and
# rejected their file when they could not. The comparison now joins the payroll
# domain in base_compliance_current, and is withheld unless BOTH sides arrived.
- name: occupation_code
  name_en: Occupation Code
  name_ar: رمز المهنة
  type: VARCHAR
  required: false
  description_en: Official occupation code recorded on the government platform.
  description_ar: رمز المهنة الرسمي المسجل في المنصة الحكومية.
  example: '2411'
- name: occupation_match_status
  name_en: Occupation Match Status
  name_ar: حالة تطابق المهنة
  type: VARCHAR
  required: false
  description_en: Whether the platform occupation matches the actual job title.
  description_ar: ما إذا كانت المهنة في المنصة تطابق المسمى الوظيفي الفعلي.
  example: Matched
  # Vocabulary authored by the practitioner, not derived from samples.
  # EXCEPTION severity: an unexpected value surfaces as a data quality
  # exception rather than refusing the client's whole file. Tighten to
  # REJECT once real files confirm the list.
  on_violation: exception
  allowed_values:
  - Matched
  - Mismatch
  value_labels:
    Matched:
      en: Matched
      ar: مطابق
    Mismatch:
      en: Mismatch
      ar: غير مطابق
