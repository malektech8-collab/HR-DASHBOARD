# Canonical bilingual schema - payroll
#
# Single source of truth for: the downloadable template, the validation rules,
# the UI labels, and the error messages. See docs/PRODUCT-ARCHITECTURE.md section 4.
#
# BACKWARD COMPATIBILITY: scripts/validate_schema.py reads only `columns` and,
# per column, `name` / `required` / `type` / `allowed_values`. Every other key
# here is additive and ignored by the validator.
#
# allowed_values MUST stay a flat list of strings - the validator compares raw
# cell values against set(allowed_values). Bilingual display lives in the
# parallel `value_labels` map.
#
# NOT YET ENFORCED (scheduled for cycle 1b, before Phase 2 real data):
#   `unique`, `min_value` - declared below but inert in the current validator.
# `observed_values` is sample-derived documentation only. It is NOT a
# vocabulary, is never validated against, and is not exhaustive.

version: 1
table: payroll
label_en: Payroll
label_ar: الرواتب
description_en: One row per employee per payroll period.
description_ar: صف واحد لكل موظف في كل فترة رواتب.
columns:
- name: payroll_period
  name_en: Payroll Period
  name_ar: فترة الرواتب
  type: VARCHAR
  required: true
  description_en: Payroll month in YYYY-MM format.
  description_ar: شهر الرواتب بصيغة سنة-شهر.
  example: 2026-06
- name: employee_id
  name_en: Employee ID
  name_ar: الرقم الوظيفي
  type: VARCHAR
  required: true
  description_en: Unique identifier of the employee within the company.
  description_ar: المعرّف الفريد للموظف داخل الشركة.
  example: EMP001
- name: basic_salary
  name_en: Basic Salary
  name_ar: الراتب الأساسي
  type: DECIMAL
  required: true
  min_value: 0
  description_en: Monthly basic salary in SAR, excluding allowances.
  description_ar: الراتب الأساسي الشهري بالريال السعودي، دون البدلات.
  example: '8000'
- name: housing_allowance
  name_en: Housing Allowance
  name_ar: بدل السكن
  type: DECIMAL
  required: true
  description_en: Monthly housing allowance in SAR.
  description_ar: بدل السكن الشهري بالريال السعودي.
  example: '2000'
- name: transport_allowance
  name_en: Transport Allowance
  name_ar: بدل النقل
  type: DECIMAL
  required: true
  description_en: Monthly transport allowance in SAR.
  description_ar: بدل النقل الشهري بالريال السعودي.
  example: '500'
- name: other_allowances
  name_en: Other Allowances
  name_ar: بدلات أخرى
  type: DECIMAL
  required: false
  description_en: >-
    Any further allowances paid this period, in SAR. OPTIONAL: many payroll systems fold every allowance into gross rather than itemising this one. Absent, the allowances figure reports the components you DID supply (housing and transport) rather than silently dropping them.
  description_ar: >-
    أي بدلات أخرى مدفوعة في هذه الفترة بالريال السعودي. اختياري: تدمج كثير من أنظمة الرواتب البدلات ضمن الإجمالي بدلاً من إفرادها. عند غيابه يعرض مجموع البدلات المكوّنات المتوفرة (السكن والمواصلات) دون إسقاطها.
  example: '0'
- name: overtime_amount
  name_en: Overtime Amount
  name_ar: مبلغ العمل الإضافي
  type: DECIMAL
  required: false
  description_en: >-
    Overtime paid this period, in SAR. OPTIONAL: a payroll export that does not separate overtime is complete without it. Absent, the overtime figure is WITHHELD rather than reported as zero - zero would read as 'no overtime was worked', which is a claim the file does not make.
  description_ar: >-
    مبلغ العمل الإضافي المدفوع في هذه الفترة بالريال السعودي. اختياري: الملف الذي لا يفصل العمل الإضافي يظل مكتملاً. عند غيابه يُحجب الرقم ولا يُعرض صفراً، لأن الصفر يعني "لم يُعمل وقت إضافي" وهو ادعاء لا يقدمه الملف.
  example: '350'
- name: deductions
  name_en: Deductions
  name_ar: الاستقطاعات
  type: DECIMAL
  required: false
  description_en: >-
    Total deductions this period, in SAR. OPTIONAL. Absent, the deductions figure is WITHHELD rather than reported as zero - zero would read as 'nothing was deducted'.
  description_ar: >-
    إجمالي الاستقطاعات في هذه الفترة بالريال السعودي. اختياري. عند غيابه يُحجب الرقم ولا يُعرض صفراً، لأن الصفر يعني "لم تُستقطع أي مبالغ".
  example: '200'
- name: gross_pay
  name_en: Gross Pay
  name_ar: إجمالي الراتب
  type: DECIMAL
  required: true
  min_value: 0
  description_en: Basic plus all allowances and overtime, before deductions.
  description_ar: الراتب الأساسي مع جميع البدلات والعمل الإضافي قبل الاستقطاعات.
  example: '10850'
- name: net_pay
  name_en: Net Pay
  name_ar: صافي الراتب
  type: DECIMAL
  required: true
  min_value: 0
  description_en: Gross pay minus deductions. The amount actually transferred.
  description_ar: إجمالي الراتب ناقص الاستقطاعات. المبلغ المحول فعلياً.
  example: '10650'
- name: location
  name_en: Location
  name_ar: الموقع
  type: VARCHAR
  required: false
  description_en: 'The site, office or yard this row belongs to. Must match a `location` in
    your locations file - that file is what says which project each site belongs to. Renamed
    from `project` in 2026-08: this column always held the physical site (the employees contract
    said so in its own work_unit description), while nothing recorded the project above it.
    A project is no longer an attribute of a row.
    OPTIONAL: a payroll line is often costed to the employee rather than to a site, so this
    may not appear on it at all. Absent, payroll breakdowns fall back to the EMPLOYEE''s
    location through the join - the same route the project resolution already takes.'
  description_ar: 'الموقع أو المكتب الذي ينتمي إليه هذا الصف. يجب أن يطابق موقعاً في ملف المواقع،
    وهو الملف الذي يحدد المشروع التابع له كل موقع. أُعيدت تسميته من `project` في ٢٠٢٦-٠٨:
    كان هذا العمود يحمل دائماً الموقع الفعلي، ولم يكن هناك ما يسجّل المشروع الأعلى منه.
    اختياري: كثيراً ما تُحمّل مسيّرة الرواتب على الموظف لا على الموقع، فقد لا يظهر هنا إطلاقاً.
    عند غيابه تعتمد تحليلات الرواتب على موقع الموظف عبر الربط.'
  example: RUH-TOWER-P1
- name: cost_center
  name_en: Cost Center
  name_ar: مركز التكلفة
  type: VARCHAR
  required: false
  description_en: >-
    Accounting cost center the cost is charged to. OPTIONAL: this usually lives in the finance system rather than the HR export, exactly as on the employees contract. Payroll breakdowns use the EMPLOYEE's cost centre through the join, so absence here costs nothing that employees does not already cover.
  description_ar: >-
    مركز التكلفة المحاسبي الذي تحمّل عليه التكلفة. اختياري: يوجد عادةً في نظام المالية لا في ملف الموارد البشرية، كما في تعاقد الموظفين. تستخدم تحليلات الرواتب مركز تكلفة الموظف عبر الربط، فغيابه هنا لا يكلّف شيئاً إضافياً.
  example: CC-100
- name: payroll_status
  name_en: Payroll Status
  name_ar: حالة الراتب
  type: VARCHAR
  required: true
  description_en: Payment status for this payroll line.
  description_ar: حالة الصرف لهذا السطر من مسير الرواتب.
  example: Paid
  # Vocabulary authored by the practitioner, not derived from samples.
  # EXCEPTION severity: an unexpected value surfaces as a data quality
  # exception rather than refusing the client's whole file. Tighten to
  # REJECT once real files confirm the list.
  on_violation: exception
  allowed_values:
  - Paid
  - Pending
  - Unpaid
  - Hold
  - Cancelled
  value_labels:
    Paid:
      en: Paid
      ar: مدفوع
    Pending:
      en: Pending
      ar: قيد المعالجة
    Unpaid:
      en: Unpaid
      ar: غير مدفوع
    Hold:
      en: Hold
      ar: معلق
    Cancelled:
      en: Cancelled
      ar: ملغى
