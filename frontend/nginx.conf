server {
    listen 8080;
    server_name localhost;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Case-insensitive templates mapping
    location ~* ^/templates/ {
        root /usr/share/nginx/html;
        rewrite ^/templates/employees\.csv$ /templates/Employees.csv break;
        rewrite ^/templates/attendance\.csv$ /templates/Attendance.csv break;
        rewrite ^/templates/compliance\.csv$ /templates/Compliance.csv break;
        rewrite ^/templates/payroll\.csv$ /templates/Payroll.csv break;
        rewrite ^/templates/employee_relations\.csv$ /templates/Employee_Relations.csv break;
        try_files $uri =404;
    }

    # Reverse proxy API requests to backend container
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Global error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
