name: 'hr_analytics'
version: '1.0.0'
config-version: 2

profile: 'hr_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  hr_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: view

vars:
  # DEMO DEFAULTS ONLY. Every date-shaped var below is overridden per run by
  # scripts/build_warehouse.py from the ONE resolved reporting period; the
  # literals exist so `dbt compile` works standalone and so demo is
  # reproducible. A date-shaped var declared here and consumed by a model but
  # NOT overridden is a repo constant pinning a client's window — the failure
  # class step 2a.5 closed. backend/tests/test_dbt_vars.py fails the build if
  # one appears.
  #
  # Data mode: 'demo' shows synthetic sample data + mock historical trend rows;
  # 'real' suppresses all fabricated rows. Committed default MUST stay 'demo'.
  # Overridden locally (uncommitted) via the DATA_MODE env var / .env.
  data_mode: "demo"
  report_month: "2026-06"
  report_month_start: "2026-06-01"
  report_month_end: "2026-06-30"
  report_anchor_date: "2026-06-30"
  talent_month_start: "2026-06-01"
  talent_month_end: "2026-06-30"
  default_sla_days: 45
  disciplinary_sla_days: 14
  grievance_sla_days: 10
  labor_case_sla_days: 30
  grace_period_minutes: 15
  min_rating: 1.0
  max_rating: 5.0
  weekend_days_sql: "'Friday'"
  has_gosi_source_sql: "TRUE"
  has_wps_source_sql: "TRUE"
  # Compile-time default. build_warehouse.py always overrides it at runtime
  # from the onboarding registry. TRUE is the safe default: it keeps the
  # cost-centre checks firing for every deployment that has not been through
  # an upload, which is every existing one.
  has_cost_center_source_sql: "TRUE"
  # Same compile-time default, same reason: TRUE keeps the manager checks
  # firing for every deployment that has not been through an upload.
  has_manager_id_source_sql: "TRUE"
  has_locations_source_sql: "TRUE"
  # The relaxed payroll money columns. TRUE keeps every existing
  # deployment behaving exactly as before.
  has_payroll_other_allowances_sql: "TRUE"
  has_payroll_overtime_sql: "TRUE"
  has_payroll_deductions_sql: "TRUE"
  critical_titles_sql: "'Chief Executive Officer', 'Engineering Director', 'Finance Director', 'HR Manager'"
  # The attendance window read by base_attendance_current and
  # base_expected_attendance. Overridden per run with report_month_start/end
  # (step 2a.5); until then these literals filtered attendance to June 2026
  # whatever period the pipeline resolved.
  start_date_str: "2026-06-01"
  end_date_str: "2026-06-30"
  # Category F. The days the client DECLARED their attendance file covers.
  # Outside this window a working day with no attendance row is NOT an
  # absence — it is unreported, and absence_days is NULL. Overridden per run
  # from the onboarding registry; the default is the demo period.
  attendance_coverage_start: "2026-06-01"
  attendance_coverage_end: "2026-06-30"
  # How far back a point-in-time headcount may legitimately reach. Trend
  # months ending before this are NULL, never a derived-but-understated
  # figure. Demo default reaches before any sample record.
  employees_history_since: "1900-01-01"
  # Trend historical-anchor months for the 2 HYBRID-COMPUTED headcount marts:
  # report_month minus 2 and minus 1. Overridden per run (step 2a.5) — the
  # resolver cycle (5a) noted the intent here and did not carry it out.
  trend_m1: "2026-04"
  trend_m1_end: "2026-04-30"
  trend_m2: "2026-05"
  trend_m2_end: "2026-05-31"


