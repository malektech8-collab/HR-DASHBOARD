# Alias table - rung 4 of the header suggestion ladder.
#
# Real Arabic HR exports do not use the contract's own labels. These are the
# spellings seen in practice, mapped to the canonical column they mean.
# Matching happens AFTER normalisation (scripts/text.py), so alef/ya/ta-marbuta
# variants, tatweel, diacritics and stray whitespace need no entry here.
#
# This file is repo content, reviewed like code - not operator-supplied data -
# which is why it is not subject to the no-expression guard that profiles are.
#
# It is seeded by hand and will be wrong somewhere. That is why rung 4 is
# SUGGESTED rather than pre-selected, and why a rejected alias is recorded in
# the profile evidence: the table gets better from what a human rejects, which
# is the only signal that says an alias was plausible AND wrong.
#
# It deliberately does NOT auto-grow from accumulated profiles. That needs
# mappings from more than one client; single-tenant accumulation would relearn
# one client's habits and call it knowledge.
#
# NOTE the deliberate collisions, and one that is now load-bearing: "الحالة" is
# status on employees, request_status on hr_requests and case_status on
# employee_relations. "المشروع" maps to `location` on the fact tables and to
# `project` ONLY on `locations` - because on a fact row that column always held
# the site, and the project a site belongs to now lives in the reference file.
# A client whose employee export is headed "project" is exactly the migration
# case: map it to `location` and supply a locations file.
# Aliases are scoped per table for exactly these reasons.
