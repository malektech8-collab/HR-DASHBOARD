# Metric provenance — which source domains each API-served mart depends on.
#
# STEP 2a. Extended from the 10 KPI marts of step 1 to EVERY mart the API
# serves, per ruling: mart_attendance_by_department selects FROM
# base_expected_attendance and so inherits the fabricator itself, returning a
# row per department with plausible absence counts summing to 494. A null KPI
# card above a populated breakdown is a visible contradiction, and a user
# resolves it in favour of the numbers.
#
# This file is the mapping only. No suppression behaviour reads it yet; that
# is step 2b.
#
# SUPPRESSION MODE, declared explicitly per mart — never inferred from row
# count. Several marts are single-row only by accident of the sample data
# (mart_attendance_late_arrival has one row because the sample has one late
# arrival) and would be misclassified by any runtime heuristic.
#
#   mode: column   the single row MIXES provenance, so mapped columns are
#                  nulled individually. mart_exec_kpis carries
#                  active_headcount (employees) and payroll_cost (payroll) in
#                  one row: with declared:[employees] the row must return a
#                  real headcount and a null payroll cost.
#
#   mode: payload  the ROWS are fabricated, not merely their values. A
#                  breakdown over an absent domain invents the rows it groups
#                  by, so the whole payload is suppressed.
#
# A SUPPRESSED PAYLOAD RETURNS null, NEVER []. An empty array renders as an
# empty chart, and an empty chart is a claim that the period had no events.
#
# DEFAULT-DENY. An unmapped mart or column is suppressed, not passed through.
# CI fails when any API-served mart is missing here.
#
# MULTI-SOURCE means ALL-REQUIRED. A partially-sourced metric is not a real one.
#
# domains: [] means no source domain — a period label or pipeline metadata.
# Each one bypasses suppression, so each must state why on the same line.
#
# scope_to_provided: true is ruling 1's exception, limited to
# data_quality_score and total_active_exceptions.
#
# ANCHOR DEPENDENCY (found in step 2a). Eight models derive their reporting
# anchor from MAX(payroll_period). With payroll absent the anchor is NULL,
# every date-window comparison collapses, and the count reads 0 — a fabricated
# zero even on a DECLARED domain.
#
# RESOLVED IN 2a.5. All seven anchor sites were converged on var('report_month'),
# matching the idiom base_document_expiry already used. The payroll terms those
# metrics briefly carried were an artefact of the old idiom and have been
# reverted to their true domains. base_command_center_data_freshness keeps its
# MAX(payroll_period): there it is the freshness METRIC, not an anchor.

version: 2

domains:
  contracted:
    employees: [employees]
    payroll: [payroll]
    attendance: [attendance]
    compliance: [compliance]
    hr_requests: [hr_requests]
    employee_relations: [employee_relations]
  uncontracted:
    recruitment:
      - recruitment_requisitions
      - candidates
      - interviews
      - offers
      - onboarding
      - vacancy_requests
      - workforce_plan
    talent:
      - performance_reviews
      - performance_goals
      - competency_assessments
      - learning_enrollments
      - training_catalog
      - succession_plans
      - talent_reviews
      - employee_skills
      - career_paths

marts:

  mart_exec_kpis:
    mode: column
    columns:
      report_month: []   # period label, not a measure
      active_headcount: [employees]
      joiners_count: [employees]
      leavers_count: [employees]
      turnover_rate: [employees]
      payroll_cost: [payroll]
      overtime_cost: [payroll]                      # SUM(overtime_amount) from payroll
      absence_days: [attendance]
      data_quality_score:
        domains: [employees, payroll, attendance, compliance]
        scope_to_provided: true

  mart_workforce_kpis:
    mode: column
    columns:
      active_headcount: [employees]
      saudi_headcount: [employees]
      non_saudi_headcount: [employees]
      saudization_rate: [employees]
      probation_count: [employees]          # REVERTED in 2a.5: the payroll term was the ANCHOR, now var('report_month')
      contract_expiring_30: [employees]     # REVERTED in 2a.5 - see probation_count
      iqama_expiring_30: [employees, compliance]  # payroll REVERTED in 2a.5; compliance is REAL (LEFT JOINs stg_compliance)
      missing_manager_count: [employees]
      missing_project_count: [employees]
      missing_cost_center_count: [employees]

  mart_payroll_kpis:
    mode: column
    columns:
      total_payroll_cost: [payroll]
      basic_salary_cost: [payroll]
      allowances_cost: [payroll]
      overtime_cost: [payroll]
      deductions: [payroll]
      net_payroll: [payroll]
      avg_cost_per_employee: [payroll]
      payroll_variance_pct: [payroll]
      employees_paid: [payroll]
      payroll_exception_count: [payroll, employees] # exceptions join payroll rows to employee attributes

  mart_attendance_kpis:
    mode: column
    columns:
      attendance_compliance_pct: [attendance, employees] # denominator is the expected-workday calendar: employees x dates
      absence_days: [attendance, employees]         # Category A: read 494.0 at declared:[employees] - one full absence per employee per workday, manufactured by base_expected_attendance
      late_minutes: [attendance]
      excused_late_minutes: [attendance]
      net_late_minutes: [attendance]
      early_leave_minutes: [attendance]
      missing_punch_count: [attendance]
      overtime_hours: [attendance]
      overtime_cost: [attendance, payroll]          # reconciles attendance OT hours against PAID OT cost
      attendance_exception_count: [attendance, employees, payroll]

  mart_compliance_kpis:
    mode: column
    columns:
      saudi_headcount: [employees]                  # sourced from employees despite the mart name
      non_saudi_headcount: [employees]
      employees_missing_nationality: [employees]
      saudization_pct: [employees]
      iqamas_expiring_30: [compliance]
      work_permits_expiring_30: [compliance]
      iqamas_expired: [compliance]
      work_permits_expired: [compliance]
      gosi_missing_count: [compliance]              # Category B: read 19 at declared:[employees] - a false regulatory finding delivered to a Saudi employer
      wps_exception_count: [compliance]
      compliance_exception_count: [compliance, employees]

  mart_er_kpis:
    mode: column
    columns:
      total_open_er_cases: [employee_relations]
      new_cases_this_month: [employee_relations]
      closed_cases_this_month: [employee_relations]
      average_case_aging_days: [employee_relations]
      overdue_cases: [employee_relations]
      sla_compliance_pct: [employee_relations]      # Category C: read 100.0 over zero cases - a wrong GOOD number, which invites no questions
      disciplinary_cases: [employee_relations]
      grievance_cases: [employee_relations]
      labor_cases: [employee_relations]
      escalated_cases: [employee_relations]
      er_exception_count: [employee_relations, employees]

  mart_recruitment_kpis:
    mode: column
    columns:
      open_requisitions: [recruitment]
      approved_vacancies: [recruitment]
      candidates_in_pipeline: [recruitment]
      interviews_scheduled: [recruitment]
      offers_extended: [recruitment]
      offer_acceptance_pct: [recruitment]
      hires_this_month: [recruitment]
      average_time_to_fill: [recruitment]
      overdue_requisitions: [recruitment]
      workforce_plan_fulfillment_pct: [recruitment, employees]
      recruitment_exception_count: [recruitment, employees]

  mart_talent_kpis:
    mode: column
    columns:
      employees_reviewed: [talent]
      review_completion_pct: [talent, employees]
      average_performance_rating: [talent]
      high_performers: [talent]
      low_performers: [talent]
      goal_completion_pct: [talent]
      training_completion_pct: [talent]
      average_training_hours: [talent]
      critical_roles_covered_pct: [talent]
      ready_successors: [talent]
      talent_exception_count: [talent, employees]

  mart_data_quality_summary:
    mode: column
    columns:
      data_quality_score:
        domains: [employees, payroll, attendance, compliance]
        scope_to_provided: true
      missing_manager_count: [employees]
      missing_project_count: [employees]
      missing_cost_center_count: [employees]
      missing_nationality_count: [employees]
      duplicate_employee_count: [employees]
      invalid_payroll_count: [payroll, employees]

  mart_command_center_overview:
    mode: column
    columns:
      active_headcount: [employees]
      payroll_cost: [payroll]
      attendance_compliance_pct: [attendance, employees]
      saudization_pct: [employees]
      open_er_cases: [employee_relations]
      open_requisitions: [recruitment]
      review_completion_pct: [talent, employees]
      total_active_exceptions:
        domains: [employees, payroll, attendance, compliance, employee_relations, recruitment, talent]
        scope_to_provided: true
      modules_healthy: []   # system health, not client data
      last_data_refresh: []   # pipeline timestamp
      latest_source_business_date: []   # pipeline metadata
      data_quality_score:
        domains: [employees, payroll, attendance, compliance]
        scope_to_provided: true

  base_command_center_module_registry:
    mode: payload
    domains: [attendance, compliance, payroll]

  base_command_center_report_context:
    mode: payload
    domains: []   # period metadata only - no client measures, so never suppressed

  mart_attendance_coverage:
    mode: payload
    domains: [attendance]
    # The coverage surface itself. Payload mode with [attendance] means it
    # self-suppresses when attendance is absent - correct: the `suppressed`
    # block is already saying so, and a coverage note beside it would be noise.

  mart_attendance_by_department:
    mode: payload
    domains: [attendance, employees, payroll]
    # selects FROM base_expected_attendance, so it inherits the FABRICATOR: a row per department with plausible absence counts summing to 494

  mart_attendance_by_project:
    mode: payload
    domains: [attendance, employees, payroll]
    # same fabricator as by_department

  mart_attendance_exceptions:
    mode: payload
    domains: [attendance, employees, payroll]

  mart_attendance_late_arrival:
    mode: payload
    domains: [attendance, employees]

  mart_attendance_missing_punches:
    mode: payload
    domains: [attendance, employees]

  mart_attendance_overtime:
    mode: payload
    domains: [attendance, employees, payroll]

  mart_attendance_trend:
    mode: payload
    domains: [attendance, employees, payroll]

  mart_command_center_data_freshness:
    mode: payload
    domains: [attendance, compliance, employee_relations, employees, payroll, recruitment, talent]

  mart_command_center_exception_summary:
    mode: payload
    domains: [attendance, compliance, employee_relations, employees, hr_requests, payroll, recruitment, talent]

  mart_command_center_filter_options:
    mode: payload
    domains: [attendance, compliance, employees, payroll]
    # filter dropdown values; suppressing them would break navigation rather than protect a number

  mart_command_center_module_health:
    mode: payload
    domains: [attendance, compliance, employee_relations, employees, hr_requests, payroll, recruitment, talent]

  mart_command_center_navigation_status:
    mode: payload
    domains: [attendance, compliance, payroll]

  mart_command_center_priority_alerts:
    mode: payload
    domains: [attendance, compliance, employee_relations, employees, hr_requests, payroll, recruitment, talent]

  mart_competency_gaps:
    mode: payload
    domains: [employees, talent]

  mart_compliance_exceptions:
    mode: payload
    domains: [compliance, employees, payroll]

  mart_data_quality_exceptions:
    mode: payload
    domains: [employees, payroll, attendance, compliance]
    # Derives from the gold DQ report rather than a source table, so the ref
    # graph resolves no domain. Treated by analogy with ruling 1: scoped, not
    # suppressed. Suppressing it would hide the exceptions a client most needs
    # DURING onboarding — the rows that tell them which of their uploaded
    # records are wrong.
    #
    # SCOPE MEANS FILTER, NOT PASS THROUGH. Rows whose source domain is not
    # provided MUST be removed. Unfiltered, this becomes the route the entire
    # fabricated exception set takes to the client — measured at
    # declared:[employees] as attendance 494, compliance 135, payroll 19,
    # against a demo baseline of 667 — on the screen they read most closely
    # during onboarding. Implemented in step 4.
    scope_to_provided: true
    scope_filter: source_table

  mart_document_expiry:
    mode: payload
    domains: [compliance, employees]

  mart_er_aging_buckets:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_er_case_status_distribution:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_er_case_trend:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_er_case_type_distribution:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_er_cases_by_department:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_er_cases_by_project:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_er_exceptions:
    mode: payload
    domains: [compliance, employee_relations, employees, hr_requests]

  mart_er_sla_performance:
    mode: payload
    domains: [employee_relations, employees, hr_requests]

  mart_exec_trends:
    mode: payload
    domains: [employees, payroll]

  mart_goal_completion:
    mode: payload
    domains: [employees, talent]

  mart_gosi_status:
    mode: payload
    domains: [compliance, employees]

  mart_learning_by_project:
    mode: payload
    domains: [employees, talent]

  mart_learning_completion:
    mode: payload
    domains: [employees, talent]

  mart_offer_acceptance:
    mode: payload
    domains: [recruitment]

  mart_onboarding_status:
    mode: payload
    domains: [recruitment]

  mart_payroll_by_department:
    mode: payload
    domains: [employees, payroll]

  mart_payroll_by_project:
    mode: payload
    domains: [employees, payroll]

  mart_payroll_components:
    mode: payload
    domains: [employees, payroll]

  mart_payroll_exceptions:
    mode: payload
    domains: [attendance, employees, payroll]
    # ANCHOR from MAX(payroll_period)

  mart_payroll_reconciliation:
    mode: payload
    domains: [attendance, employees, payroll]

  mart_payroll_trend:
    mode: payload
    domains: [payroll]

  mart_payroll_variance_components:
    mode: payload
    domains: [employees, payroll]

  mart_payroll_variance_employees:
    mode: payload
    domains: [employees, payroll]

  mart_performance_by_department:
    mode: payload
    domains: [employees, talent]

  mart_performance_by_project:
    mode: payload
    domains: [employees, talent]

  mart_performance_distribution:
    mode: payload
    domains: [employees, talent]

  mart_recruitment_by_department:
    mode: payload
    domains: [recruitment]

  mart_recruitment_by_project:
    mode: payload
    domains: [recruitment]

  mart_recruitment_exceptions:
    mode: payload
    domains: [employees, recruitment]

  mart_recruitment_pipeline:
    mode: payload
    domains: [recruitment]

  mart_recruitment_source_effectiveness:
    mode: payload
    domains: [recruitment]

  mart_recruitment_time_to_fill:
    mode: payload
    domains: [recruitment]

  mart_recruitment_trends:
    mode: payload
    domains: [recruitment]

  mart_saudization_by_department:
    mode: payload
    domains: [employees]

  mart_saudization_by_project:
    mode: payload
    domains: [employees]

  mart_saudization_summary:
    mode: payload
    domains: [compliance, employees, payroll]

  mart_succession_coverage:
    mode: payload
    domains: [employees, talent]

  mart_successor_readiness:
    mode: payload
    domains: [talent]

  mart_talent_exceptions:
    mode: payload
    domains: [employees, talent]

  mart_talent_review_trends:
    mode: payload
    domains: [employees, talent]

  mart_talent_risk:
    mode: payload
    domains: [employees, talent]

  mart_workforce_contract_expiry:
    mode: payload
    domains: [employees]
    # ANCHOR from MAX(payroll_period)

  mart_workforce_distribution:
    mode: payload
    domains: [employees]

  mart_workforce_exceptions:
    mode: payload
    domains: [compliance, employees, payroll]
    # ANCHOR from MAX(payroll_period)

  mart_workforce_headcount_trend:
    mode: payload
    domains: [employees]

