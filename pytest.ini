[pytest]
# Constrain collection to the real test suite. Without this, a bare `pytest`
# at the repo root recurses from here and imports the 15 legacy debug scripts
# still sitting at top level (test_any_column.py, test_cc_checks.py, ...).
# Those have module-level side effects — they open warehouse/hr_analytics.duckdb
# read-write at import time, and one issues a live HTTP call — which stalls the
# run indefinitely. See docs/ci/ci-repair-plan.md §2 and TD-001.
testpaths = backend/tests
norecursedirs = .git .venv node_modules scratch dbt_analytics data warehouse frontend docs
